startCommand:
  type: stdio
  configSchema:
    type: object
    required:
      - airlockApiKey
    properties:
      airlockApiKey:
        type: string
        description: "Airlock API key (im_...). Get one at airlock.dev or from your self-hosted server's first-run logs."
      airlockBaseUrl:
        type: string
        description: "Base URL of a self-hosted Airlock server (e.g. http://localhost:8484). Defaults to the hosted cloud."
  commandFunction: |-
    (config) => ({
      command: "npx",
      args: ["-y", "@airlock/mcp"],
      env: {
        AIRLOCK_API_KEY: config.airlockApiKey,
        ...(config.airlockBaseUrl ? { AIRLOCK_BASE_URL: config.airlockBaseUrl } : {})
      }
    })
