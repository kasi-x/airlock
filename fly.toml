# Fly.io deploy template for the API server (Fastify + SQLite).
# Scale-to-zero: the machine sleeps when idle (near-zero cost pre-launch) and
# wakes on the first request — including Stripe webhooks.
#
# Template only: replace "your-app-name", the volume name, and every
# *.example.com domain with your own values. Upstream's hosted endpoints
# (airlock.dev) are deliberately NOT referenced anywhere in this file.
app = "your-app-name"
primary_region = "fra"

[build]
  dockerfile = "docker/server.Dockerfile"

[env]
  DB_PATH = "/data/airlock.db"
  HOST = "0.0.0.0"
  PORT = "8484"
  BASE_URL = "https://api.example.com"
  APP_URL = "https://app.example.com"
  CORS_ORIGIN = "https://app.example.com"
  ALLOW_SIGNUP = "1"
  # SENTRY_DSN is set separately as a Fly secret (not here — see deploy docs):
  #   fly secrets set SENTRY_DSN=https://...@....ingest.sentry.io/... -a your-app-name
  # Without it the server never calls into the Sentry SDK (see server/src/sentry.ts).
  SENTRY_ENVIRONMENT = "production"

[http_service]
  internal_port = 8484
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "15s"
    method = "GET"
    path = "/healthz"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

[mounts]
  source = "your_app_data"
  destination = "/data"
